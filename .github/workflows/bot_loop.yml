name: Bot (always on, restarts every 6 hours)

# One job keeps the bot running for ~5h50m (GitHub's limit is 6h), answering Telegram and the web chat
# within a second or two. At the end it starts this workflow again, so the bot never really stops.
# The cron line is the safety net: every 360 minutes it starts the bot if the self-restart ever failed.
# Needs a PUBLIC repo for this to be free (public repos have unlimited Actions minutes).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write           # only used when Cloudflare D1 is not set up (state is then saved in the repo)
  actions: write            # lets the bot start video renders and restart itself

concurrency:
  group: bot-loop           # never two bots at once (Telegram allows only one getUpdates reader)
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      LOOP_MINUTES: "350"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
      BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      NVIDIA_IMAGE_MODEL: ${{ vars.NVIDIA_IMAGE_MODEL }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      LLM_ORDER: ${{ vars.LLM_ORDER }}
      IMAGE_ORDER: ${{ vars.IMAGE_ORDER }}
      MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_AUTH_HEADER: ${{ secrets.WEBHOOK_AUTH_HEADER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false     # the bot pushes with a one-off token; nothing is left on disk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the bot
        run: python -m bot.loop
