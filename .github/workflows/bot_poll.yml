name: Bot Poll (manual, one-shot)

# The always-on bot (bot_loop.yml) replaced the 5-minute cron. Two readers of Telegram's getUpdates
# fight each other, so this one only runs when YOU start it by hand (Actions -> Run workflow),
# e.g. once to flush messages while bot_loop.yml is switched off.
on:
  workflow_dispatch:

permissions:
  contents: write           # saves your settings and installed skills back to the repo
  actions: write            # lets the bot start / cancel video renders

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      NVIDIA_IMAGE_MODEL: ${{ vars.NVIDIA_IMAGE_MODEL }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      LLM_ORDER: ${{ vars.LLM_ORDER }}
      IMAGE_ORDER: ${{ vars.IMAGE_ORDER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false     # the bot pushes with a one-off token; nothing is left on disk
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Handle new Telegram messages
        run: python -m bot.poll
